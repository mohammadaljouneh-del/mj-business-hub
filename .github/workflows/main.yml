*   وضع أولويات تدريب سنوية لبرامج المدرب في المناطق الأكثر حاجة
-   لرفع أداء التعليم بشكل عام. يعتبر هذا منفصلاً عن الواجبات المنزلية الفردية.
*   التركيز على ٢ إلى ٣ مجالات في سنة واحدة مع خطة تدريب شاملة تركز على الأعمال.
*   يقدم كل مستوى من التدريب تركيزاً على مهارة. يقوم المدربون/المدربون الفنيون بالتركيز على مراقبة المدربين/المدربين الفنيين في المستوى الأدنى. أما المدربون/المدربون الفنيون في المستوى الأعلى، فيمتلكون الفرصة من أجل شحد مهارتهم القيادية.
*   من أجل الحصول على الانضباط والمهارة في التيسير في قاعة الصف الحقيقية، يقوم المدربون / المدربون الفنيون "بالملاحقة كظل للمدربين / المدربين الفنيين الأكثر خبرة من أجل رؤية/سماع/تجربة كيف يتم تطبيق الدورات التدريبية في الحياة الواقعية
