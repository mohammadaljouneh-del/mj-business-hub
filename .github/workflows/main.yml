‎نعمل طوال الوقت على زرع الإبداع لدى المشاركين المتواجدين لدينا. نقوم بتحفيز الإبداع من خلال طرح الأسئلة ودعوة الجميع للإجابة عليها. نعمل على استخدام ما يتم تدريبه، سواء من الناحية التقنية أو المنهجية، كأداة لحشد قدرات الحضور. يجب أن يتمكن الحضور من تعلم التقنيات المقدمة في الورشة أولاً، ثم يتم دعوتهم إلى تطوير عملهم وإطلاق تجارب منبثقة مما تعلموه ومشاركة ذلك مع البقية.
